name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/OTP and rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          # Flexible minor match; needs a recent rebar3 for OTP 29
          rebar3-version: '3.25'

      - name: Compile
        run: rebar3 compile

      - name: Common Test
        run: rebar3 ct

      - name: Xref
        run: rebar3 xref

      - name: Dialyzer
        run: rebar3 dialyzer
